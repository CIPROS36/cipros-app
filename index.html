<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPROS Cursos</title>
<meta name="description" content="CIPROS Cursos — plataforma de formação online da CIPROS Consulting &amp; Services, Pemba, Moçambique.">
<meta name="theme-color" content="#123A63">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#123A63;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;background:#123A63;transition:opacity .3s}
#load img{width:96px;height:96px;border-radius:20px}
#load .t{font-weight:700;font-size:20px;letter-spacing:.5px}
#load .s{font-size:13px;color:#9fd8dd}
.dot{width:8px;height:8px;border-radius:50%;background:#00A6B2;display:inline-block;margin:0 3px;animation:b 1s infinite alternate}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes b{to{opacity:.2}}
</style>
</head>
<body>
<div id="load"><img src="/icon-192.png" alt=""><div class="t">CIPROS Cursos</div><div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="s">A abrir a plataforma…</div></div>
<iframe id="app" title="CIPROS Cursos" allow="clipboard-write; fullscreen"></iframe>
<script>
(function(){
  var EXEC='https://script.google.com/macros/s/AKfycbxSV1EZ1BGS4LVb11nj6TCaKScML0TFN7ms42DS8ke7GGMFEiXZZeYuLg1Xcaa6as9e/exec';
  var q=new URLSearchParams(location.search), g=q.get('g');
  var src=EXEC+'?app=cursos'+(g?'&g='+encodeURIComponent(g):'');
  var f=document.getElementById('app'), l=document.getElementById('load'), ok=false, K='cipros_modo';
  function get(){try{return localStorage.getItem(K)}catch(e){return null}}
  function set(v){try{localStorage.setItem(K,v)}catch(e){}}
  function topo(){set('topo');location.replace(src)}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
  // Se o Google não deixar abrir dentro da app (ex.: várias contas Google no telemóvel), abre directamente.
  if(get()==='topo'&&!q.has('iframe')){location.replace(src);return;}
  addEventListener('message',function(e){
    if(e.data==='cipros-ok'&&!ok){ok=true;set('iframe');l.style.opacity=0;setTimeout(function(){l.style.display='none'},300);}
  });
  f.onload=function(){setTimeout(function(){if(!ok)topo()},12000)};
  setTimeout(function(){if(!ok)topo()},40000);
  f.src=src;
  if(g&&history.replaceState)history.replaceState(null,'','/');
})();
</script>
</body>
</html>
